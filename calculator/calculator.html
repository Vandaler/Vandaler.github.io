<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .calculator-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }

        .calculator-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .calc-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 500;
            background: #f7fafc;
            transition: all 0.3s ease;
            outline: none;
        }

        .calc-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .result-input {
            background: #f0f8ff !important;
            color: #2d3748;
            font-weight: 700;
            text-align: center;
            font-size: 20px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .calc-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .calc-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .calc-btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 25px rgba(240, 147, 251, 0.6);
        }

        .clear-btn {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #2d3748;
            box-shadow: 0 4px 15px rgba(252, 182, 159, 0.4);
        }

        .clear-btn:hover {
            box-shadow: 0 8px 25px rgba(252, 182, 159, 0.6);
        }

        @media (max-width: 480px) {
            .calculator-container {
                margin: 10px;
                padding: 20px;
            }
            
            .calculator-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1 class="calculator-title">Calculator</h1>
        
        <div class="input-group">
            <label class="input-label" for="number1">First Number</label>
            <input type="number" id="number1" class="calc-input" placeholder="Enter first number">
        </div>
        
        <div class="input-group">
            <label class="input-label" for="number2">Second Number</label>
            <input type="number" id="number2" class="calc-input" placeholder="Enter second number">
        </div>
        
        <div class="input-group">
            <label class="input-label" for="result">Result</label>
            <input type="text" id="result" class="calc-input result-input" readonly placeholder="Result will appear here">
        </div>
        
        <div class="button-grid">
            <button type="button" class="calc-btn" onclick="calculate('add')">Add (+)</button>
            <button type="button" class="calc-btn btn-secondary" onclick="calculate('subtract')">Subtract (-)</button>
            <button type="button" class="calc-btn btn-secondary" onclick="calculate('multiply')">Multiply (×)</button>
            <button type="button" class="calc-btn btn-secondary" onclick="calculate('divide')">Divide (÷)</button>
            <button type="button" class="calc-btn clear-btn" onclick="clearAll()" style="grid-column: span 2;">Clear All</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
