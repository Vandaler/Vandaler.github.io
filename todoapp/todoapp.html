<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .app-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
        }

        .todo-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            background: #f7fafc;
            transition: all 0.3s ease;
            outline: none;
        }

        .todo-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            color: white;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            min-width: 60px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-item {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .todo-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
            color: #2d3748;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
        }

        .complete-btn {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .complete-btn:hover {
            transform: scale(1.05);
        }

        .remove-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            transform: scale(1.05);
        }

        .todo-item.completed {
            opacity: 0.7;
            border-left-color: #48bb78;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #718096;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #718096;
            font-style: italic;
            font-size: 18px;
        }

        .stats {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
            color: #2d3748;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .input-section {
                flex-direction: column;
            }
            
            .todo-input {
                margin-bottom: 15px;
            }
            
            .app-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="app-title">Modern To-Do List</h1>
        
        <div class="stats" id="stats">
            <span id="totalTasks">0</span> tasks total • 
            <span id="completedTasks">0</span> completed • 
            <span id="pendingTasks">0</span> pending
        </div>
        
        <div class="input-section">
            <input type="text" class="todo-input" id="todoInput" placeholder="กรอกสิ่งที่ต้องการจะทำ..." maxlength="100">
            <button class="add-btn" onclick="addTodo()">+</button>
        </div>
        
        <ul class="todo-list" id="todoList">
            <div class="empty-state" id="emptyState">
                ยังไม่มีรายการสิ่งที่ต้องทำ เริ่มเพิ่มรายการแรกของคุณกันเลย! 🎯
            </div>
        </ul>
    </div>

    <script>
        let todos = [];
        let todoIdCounter = 1;

        function addTodo() {
            const inputValue = document.getElementById("todoInput").value.trim();
            if (inputValue === "") {
                alert("โปรดระบุสิ่งที่ต้องการทำ");
                return;
            }

            const todo = {
                id: todoIdCounter++,
                text: inputValue,
                completed: false
            };

            todos.push(todo);
            document.getElementById("todoInput").value = "";
            renderTodos();
            updateStats();
        }

        function removeTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            renderTodos();
            updateStats();
        }

        function toggleComplete(id) {
            const todo = todos.find(todo => todo.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                renderTodos();
                updateStats();
            }
        }

        function renderTodos() {
            const todoList = document.getElementById("todoList");
            const emptyState = document.getElementById("emptyState");
            
            if (todos.length === 0) {
                emptyState.style.display = "block";
                return;
            }
            
            emptyState.style.display = "none";
            
            todoList.innerHTML = todos.map(todo => `
                <li class="todo-item ${todo.completed ? 'completed' : ''}">
                    <span class="todo-text">${todo.text}</span>
                    <div class="todo-actions">
                        <button class="complete-btn" onclick="toggleComplete(${todo.id})">
                            ${todo.completed ? '↩️' : '✓'}
                        </button>
                        <button class="remove-btn" onclick="removeTodo(${todo.id})">
                            🗑️
                        </button>
                    </div>
                </li>
            `).join('');
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(todo => todo.completed).length;
            const pending = total - completed;
            
            document.getElementById("totalTasks").textContent = total;
            document.getElementById("completedTasks").textContent = completed;
            document.getElementById("pendingTasks").textContent = pending;
        }

        // Add keyboard support
        document.getElementById("todoInput").addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                addTodo();
            }
        });

        // Initialize
        updateStats();
    </script>
</body>
</html>
