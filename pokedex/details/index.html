<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
            color: white;
            text-decoration: none;
        }

        .pokemon-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .pokemon-name {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: capitalize;
        }

        .pokemon-id {
            font-size: 18px;
            color: #718096;
            font-weight: 500;
        }

        .pokemon-main {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            align-items: start;
            margin-bottom: 40px;
        }

        .pokemon-image {
            text-align: center;
        }

        .pokemon-image img {
            width: 300px;
            height: 300px;
            object-fit: contain;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .pokemon-info {
            display: grid;
            gap: 20px;
        }

        .info-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .info-section h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #2d3748;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .basic-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 12px;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        .types {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .type-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .abilities {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ability-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            text-transform: capitalize;
            background: #f7fafc;
            color: #2d3748;
            border: 2px solid #e2e8f0;
        }

        .stats-grid {
            display: grid;
            gap: 10px;
        }

        .stat-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-name {
            min-width: 120px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .stat-progress {
            flex: 1;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .stat-number {
            min-width: 40px;
            font-weight: 700;
            text-align: right;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #718096;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e53e3e;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .pokemon-name {
                font-size: 36px;
            }
            
            .pokemon-main {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .pokemon-image img {
                width: 250px;
                height: 250px;
            }
            
            .basic-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">← Back to Pokédex</a>
        
        <div id="loading" class="loading">Loading Pokémon details... 🎯</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="pokemonContent" style="display: none;">
            <div class="pokemon-header">
                <h1 class="pokemon-name" id="pokemonName">Loading...</h1>
                <p class="pokemon-id" id="pokemonId">#000</p>
            </div>
            
            <div class="pokemon-main">
                <div class="pokemon-image">
                    <img id="pokemonImage" src="" alt="">
                </div>
                
                <div class="pokemon-info">
                    <div class="info-section">
                        <h3>Basic Info</h3>
                        <div class="basic-stats">
                            <div class="stat-item">
                                <div class="stat-label">Height</div>
                                <div class="stat-value" id="pokemonHeight">-</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Weight</div>
                                <div class="stat-value" id="pokemonWeight">-</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <h3>Types</h3>
                        <div class="types" id="pokemonTypes"></div>
                    </div>
                    
                    <div class="info-section">
                        <h3>Abilities</h3>
                        <div class="abilities" id="pokemonAbilities"></div>
                    </div>
                </div>
            </div>
            
            <div class="info-section">
                <h3>Base Stats</h3>
                <div class="stats-grid" id="pokemonStats"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pokemonId = urlParams.get('id');

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('pokemonContent').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            hideLoading();
        }

        function showPokemonData(pokemon) {
            hideLoading();
            document.getElementById('error').style.display = 'none';
            document.getElementById('pokemonContent').style.display = 'block';

            document.getElementById('pokemonName').textContent = pokemon.name;
            document.getElementById('pokemonId').textContent = `#${pokemon.id.toString().padStart(3, '0')}`;
            document.getElementById('pokemonImage').src = pokemon.sprites.front_default || pokemon.sprites.front_shiny;
            document.getElementById('pokemonImage').alt = pokemon.name;
            document.getElementById('pokemonHeight').textContent = `${pokemon.height / 10} m`;
            document.getElementById('pokemonWeight').textContent = `${pokemon.weight / 10} kg`;

            const typesContainer = document.getElementById('pokemonTypes');
            typesContainer.innerHTML = '';
            pokemon.types.forEach(type => {
                const typeBadge = document.createElement('span');
                typeBadge.className = 'type-badge';
                typeBadge.textContent = type.type.name;
                typesContainer.appendChild(typeBadge);
            });

            const abilitiesContainer = document.getElementById('pokemonAbilities');
            abilitiesContainer.innerHTML = '';
            pokemon.abilities.forEach(ability => {
                const abilityBadge = document.createElement('span');
                abilityBadge.className = 'ability-badge';
                abilityBadge.textContent = ability.ability.name.replace('-', ' ');
                abilitiesContainer.appendChild(abilityBadge);
            });

            const statsContainer = document.getElementById('pokemonStats');
            statsContainer.innerHTML = '';
            pokemon.stats.forEach(stat => {
                const statBar = document.createElement('div');
                statBar.className = 'stat-bar';
                
                const maxStat = 255;
                const percentage = (stat.base_stat / maxStat) * 100;
                
                statBar.innerHTML = `
                    <div class="stat-name">${stat.stat.name.replace('-', ' ')}</div>
                    <div class="stat-progress">
                        <div class="stat-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div class="stat-number">${stat.base_stat}</div>
                `;
                
                statsContainer.appendChild(statBar);
            });
        }

        async function fetchPokemonData() {
            if (!pokemonId) {
                showError('No Pokémon ID provided');
                return;
            }

            showLoading();

            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
                
                if (!response.ok) {
                    throw new Error('Pokémon not found');
                }
                
                const pokemon = await response.json();
                showPokemonData(pokemon);
                
            } catch (error) {
                console.error('Error fetching Pokémon data:', error);
                showError(`Failed to load Pokémon data: ${error.message}`);
            }
        }
        document.addEventListener('DOMContentLoaded', fetchPokemonData);
    </script>
</body>
</html>
