<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pokédex</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>🔥 Modern Pokédex 🔥</h1>
        <div id="pokemonContainer"></div>
        <div id="loading" class="loading" style="display: none;">Loading more Pokémon... 🎯</div>
        <div id="error" class="error" style="display: none;">Error loading Pokémon. Please try again.</div>
    </div>
    
    <center>
        <button id="loadMoreBtn" class="btnn">Load More Pokémon</button>
    </center>

    <script>
        let offset = 0;
        const limit = 20;
        let isLoading = false;

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loadMoreBtn').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('loadMoreBtn').style.display = 'block';
        }

        function showError() {
            document.getElementById('error').style.display = 'block';
            hideLoading();
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        async function fetchPokemons(currentOffset, currentLimit) {
            if (isLoading) return;
            
            isLoading = true;
            showLoading();
            hideError();

            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon?offset=${currentOffset}&limit=${currentLimit}`);
                const data = await response.json();
                const pokemons = data.results;
                const container = document.getElementById('pokemonContainer');

                const pokemonPromises = pokemons.map(async (pokemon) => {
                    const pokemonId = pokemon.url.split('/')[6];
                    try {
                        const pokemonResponse = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
                        const pokemonData = await pokemonResponse.json();
                        return {
                            id: pokemonId,
                            name: pokemonData.name,
                            image: pokemonData.sprites.front_default || pokemonData.sprites.front_shiny,
                            types: pokemonData.types.map(type => type.type.name)
                        };
                    } catch (error) {
                        console.error("Error fetching Pokemon:", pokemon.name, error);
                        return null;
                    }
                });

                const pokemonDetails = await Promise.all(pokemonPromises);
                
                pokemonDetails.forEach(pokemon => {
                    if (pokemon) {
                        const pokemonCard = document.createElement('a');
                        pokemonCard.href = `details/index.html?id=${pokemon.id}`;
                        pokemonCard.className = 'pokemon-card';
                        
                        pokemonCard.innerHTML = `
                            <img src="${pokemon.image}" alt="${pokemon.name}" loading="lazy">
                            <div class="card-body">
                                <div class="pokemon-name">${pokemon.name}</div>
                                <div class="pokemon-id">#${pokemon.id.padStart(3, '0')}</div>
                            </div>
                        `;
                        
                        container.appendChild(pokemonCard);
                    }
                });

                offset += currentLimit;
                
            } catch (error) {
                console.error("Error fetching Pokemon list:", error);
                showError();
            } finally {
                isLoading = false;
                hideLoading();
            }
        }

        // Load more button event
        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            fetchPokemons(offset, limit);
        });

        // Infinite scroll
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1000) {
                fetchPokemons(offset, limit);
            }
        });

        // Initial load
        fetchPokemons(offset, limit);
    </script>
</body>
</html>
