<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
        }

        .app-title {
            margin-bottom: 40px;
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .weather-form {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .city-input {
            flex: 1;
            max-width: 300px;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            background: #f7fafc;
            transition: all 0.3s ease;
            outline: none;
        }

        .city-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .weather-result {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 20px;
            display: none;
        }

        .weather-result.show {
            display: block;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .weather-icon {
            font-size: 80px;
        }

        .weather-temp {
            font-size: 48px;
            font-weight: 700;
            color: #2d3748;
        }

        .weather-description {
            font-size: 20px;
            color: #718096;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .detail-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .detail-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 600;
        }

        .loading {
            display: none;
            color: #718096;
            font-style: italic;
            margin-top: 20px;
        }

        .error {
            display: none;
            color: #e53e3e;
            font-weight: 600;
            margin-top: 20px;
            padding: 15px;
            background: rgba(229, 62, 62, 0.1);
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .app-title {
                font-size: 28px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .city-input {
                max-width: 100%;
                margin-bottom: 15px;
            }
            
            .weather-main {
                flex-direction: column;
                gap: 10px;
            }
            
            .weather-temp {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="app-title">🌤️ Weather App</h1>
        
        <form id="weatherForm" class="weather-form">
            <div class="input-group">
                <input type="text" id="city" class="city-input" placeholder="Enter city name..." required>
                <button type="submit" class="search-btn">Get Weather</button>
            </div>
        </form>
        
        <div id="loading" class="loading">Loading weather data... ⏳</div>
        <div id="error" class="error"></div>
        
        <div id="weatherResult" class="weather-result">
            <div class="weather-main">
                <div class="weather-icon" id="weatherIcon">🌤️</div>
                <div>
                    <div class="weather-temp" id="temperature">--°C</div>
                    <div class="weather-description" id="description">--</div>
                </div>
            </div>
            
            <div class="weather-details">
                <div class="detail-card">
                    <div class="detail-label">อุณหภูมิ</div>
                    <div class="detail-value" id="feelsLike">--องศา</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">ความชื้น</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">ความเร็วลม</div>
                    <div class="detail-value" id="windSpeed">-- เมตร/วิ</div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">ความดัน</div>
                    <div class="detail-value" id="pressure">-- ปาสคาล</div>
                </div>
            </div>
            
            <div id="forecast"></div>
        </div>
    </div>

    <script src="weather.js"></script>
</body>
</html>
